services:
  - type: web
    name: freightwise-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: AISSTREAM_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: OILPRICEAPI_KEY
        sync: false
